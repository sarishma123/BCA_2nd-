<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      /*class selector*/
      .box{
        color:black;
        height:200px;
        width:200px;
        text-align:center;
        /*box shadow: x y blur spread color*/
        box-shadow: 10px 10px 10px palegreen;
        border-radius: 20px;
        /*boder:width type color*/
        border: 2px solid  red;
        margin:30px;
      }
         /*id selector(#)*/
         #first-group{
          background-color:blue;
         }
         #second-group{
          background-color:red;
         }

        p{
            color:blue;
            font-size: 50px;
            font-weight:bold;
            text-shadow:2px 2px 5px grey;
             }
             span {
                color:red;
                font-size:bolder;
                text-shadow: 5px 9px 10px purple;
             }
    </style>
</head>
<body>
  <p> Welcome
  <span>
    Nepal
  </span>
  </p>  
<!--block grouping-->
<!--first grouping-->
<div class="box" id="first group">
  <h1> first block grouping</h1>
</div>
<!--first grouping-->
<div class="box" id="second  group">
  <h1> second block grouping</h1>
</div>

</body>
</html>
