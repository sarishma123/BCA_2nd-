<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>types of list </title>
</head>
<body>
    <!--unorder list-->
    <!--type:disc,circle,square-->
    <ul type="square">
        <li> apple</li>
        <li> kiwi</li>
        <li> coffee</li>
        <li> date seed</li>
    </ul>
    <!--ordered list-->
    <ol type="a" start="26">
        <li> apple</li>
        <li> kiwi</li>
        <li> coffee</li>
        <li> date seed</li>
        </ol>

    <dl>
        <li> aalu</li>
        <dd> pagal</dd>
        <dt> date seed</dt>
        <dd> a decafinee cofeee ingrident</dd>
        
    </dl>
</body>
</html>
