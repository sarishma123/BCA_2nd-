<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html list design</title>
    <link type="text/css" href="htmllist .css" rel="stylesheet">
</head>

<body>
    <!--main div-->
    <div id="root">
        <h1> list design </h1>

        <!--section for all the  cards-->
        <div id="card-section">
            <!--first card-->
            <div  class="card"
            id="friut-card">
            <h2> fruits </h2>
        
                    <ol>
                        <li> apple</li>
                        <li> kiwi</li>
                        <li>mango</li>
                        <li>orange</li>
                    </ol>
                    </div>
           
            <!--second card-->
            <div class="card" id="vegetable-card">
            <h3> vegetables</h3>
        <ul type="square">
            <li> tomato</li>
            <li>potato</li>
            <li> onion</li>
        </div>
        </ul>
            <!--third card-->
            <div class="card"
            id="Groceries-card">
            <h4> Groceries</h4>
        <ul type="circle">
            <li>Rice </li>
            <li>barley</li>
            <li>maize </li>
        </ul>
        </div>
        </div>
        </div>
</body>
</html>
